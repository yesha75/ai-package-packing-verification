<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Object detection evaluation metrics</title>
  <desc id="desc">Bar chart comparing precision, recall, mAP at 0.5, and mAP at 0.5 to 0.95 for the COCO baseline and Zenodo packing-scene experiment. The datasets are different and not directly comparable.</desc>
  <rect width="1200" height="490" rx="24" fill="#f7f9fc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324b">Object detection metrics · percentage</text>
  <text x="600" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#62758a">Separate evaluations; results are not directly comparable</text>
  <g font-family="Arial,sans-serif">
    <text x="50" y="118" font-size="17" font-weight="700" fill="#18324b">COCO validation · four selected classes</text>
    <text x="50" y="320" font-size="17" font-weight="700" fill="#18324b">Zenodo packing scenes · five selected classes · one training epoch</text>
    <g stroke="#dce3eb" stroke-width="1">
      <path d="M260 142H1120M260 169.5H1120M260 197H1120M260 224.5H1120M260 252H1120"/>
      <path d="M260 344H1120M260 371H1120M260 398H1120M260 425H1120M260 452H1120"/>
    </g>
    <g fill="#64778b" font-size="11" text-anchor="end">
      <text x="250" y="146">100</text><text x="250" y="173.5">75</text><text x="250" y="201">50</text><text x="250" y="228.5">25</text><text x="250" y="256">0</text>
      <text x="250" y="348">100</text><text x="250" y="375">75</text><text x="250" y="402">50</text><text x="250" y="429">25</text><text x="250" y="456">0</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#465b70">
      <text x="365" y="276">Precision</text><text x="565" y="276">Recall</text><text x="765" y="276">mAP@0.5</text><text x="965" y="276">mAP@0.5:0.95</text>
      <text x="365" y="477">Precision</text><text x="565" y="477">Recall</text><text x="765" y="477">mAP@0.5</text><text x="965" y="477">mAP@0.5:0.95</text>
    </g>
  </g>
  <g fill="#6489d6">
    <rect x="330" y="211" width="70" height="41" rx="5"/><rect x="530" y="224" width="70" height="28" rx="5"/><rect x="730" y="226" width="70" height="26" rx="5"/><rect x="930" y="235" width="70" height="17" rx="5"/>
  </g>
  <g fill="#32a17c">
    <rect x="330" y="348" width="70" height="104" rx="5"/><rect x="530" y="346" width="70" height="106" rx="5"/><rect x="730" y="348" width="70" height="104" rx="5"/><rect x="930" y="362" width="70" height="90" rx="5"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#18324b">
    <text x="365" y="204">38.3</text><text x="565" y="217">26.2</text><text x="765" y="219">24.4</text><text x="965" y="228">15.4</text>
    <text x="365" y="341">96.0</text><text x="565" y="339">98.0</text><text x="765" y="341">96.1</text><text x="965" y="355">83.4</text>
  </g>
  <rect x="50" y="164" width="12" height="12" rx="3" fill="#6489d6"/><text x="70" y="175" font-family="Arial,sans-serif" font-size="12" fill="#465b70">COCO baseline</text>
  <rect x="50" y="365" width="12" height="12" rx="3" fill="#32a17c"/><text x="70" y="376" font-family="Arial,sans-serif" font-size="12" fill="#465b70">Fine-tuned packing detector</text>
</svg>
